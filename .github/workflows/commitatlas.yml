name: Refresh CommitAtlas profile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .commitatlas.json
      - .github/workflows/commitatlas.yml
      - scripts/update-commitatlas-image-versions.mjs
  schedule:
    - cron: "23 5,17 * * *"

permissions:
  contents: write

concurrency:
  group: commitatlas-profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'Chris0Jeky/Chris0Jeky'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Generate public CommitAtlas assets
        id: commitatlas
        uses: Chris0Jeky/CommitAtlas@2177748bdd7557a32d0c30b80eb7c59c4d0df342
        with:
          config: .commitatlas.json

      - name: Validate complete paired bundle
        shell: bash
        env:
          COMMITATLAS_OUTPUTS_JSON: ${{ toJSON(steps.commitatlas.outputs) }}
        run: node scripts/validate-commitatlas-bundle.mjs

      - name: Update generated selected work catalog
        shell: bash
        run: node scripts/update-project-catalog.mjs README.md assets/commitatlas/projects.json

      - name: Version generated CommitAtlas image URLs
        shell: bash
        run: node scripts/update-commitatlas-image-versions.mjs

      - name: Commit refreshed public assets
        shell: bash
        run: |
          git add -- README.md assets/commitatlas
          if git diff --cached --quiet; then
            echo "CommitAtlas assets are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(profile): refresh CommitAtlas assets"
          git push origin HEAD:main

