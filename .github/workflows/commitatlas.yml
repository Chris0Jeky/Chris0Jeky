name: Refresh CommitAtlas profile

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: write

concurrency:
  group: commitatlas-profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'Chris0Jeky/Chris0Jeky'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Generate public CommitAtlas assets
        id: commitatlas
        uses: Chris0Jeky/CommitAtlas@d2927e2eafb4b74b485d0cc28634f6768a21b707
        with:
          config: .commitatlas.json

      - name: Validate generated bundle
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const manifest = JSON.parse(fs.readFileSync('${{ steps.commitatlas.outputs.manifest }}', 'utf8'));
          const expected = ['activity.svg', 'atlas-compact.svg', 'atlas.svg', 'languages.svg', 'profile.svg', 'projects.svg', 'streak.svg'];
          const artifacts = manifest.artifacts.map((artifact) => artifact.path).sort();
          if (manifest.user !== 'Chris0Jeky' || JSON.stringify(artifacts) !== JSON.stringify(expected)) {
            throw new Error('Unexpected CommitAtlas responsive manifest');
          }
          if ('${{ steps.commitatlas.outputs.atlas-compact }}' !== 'assets/commitatlas/atlas-compact.svg') {
            throw new Error('Compact Atlas output is missing');
          }
          for (const artifact of manifest.artifacts) {
            const path = `assets/commitatlas/${artifact.path}`;
            const body = fs.readFileSync(path);
            const digest = crypto.createHash('sha256').update(body).digest('hex');
            if (body.length !== artifact.bytes || digest !== artifact.sha256) {
              throw new Error(`Manifest mismatch for ${path}`);
            }
          }
          NODE

      - name: Commit refreshed public assets
        shell: bash
        run: |
          git add -- assets/commitatlas
          if git diff --cached --quiet; then
            echo "CommitAtlas assets are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(profile): refresh CommitAtlas assets"
          git push origin HEAD:main
