name: Refresh CommitAtlas profile

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: write

concurrency:
  group: commitatlas-profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'Chris0Jeky/Chris0Jeky'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Generate public CommitAtlas assets
        id: commitatlas
        uses: Chris0Jeky/CommitAtlas@68ac8985de842773768726c9c324cd7385065501
        with:
          config: .commitatlas.json

      - name: Generate compact mobile Atlas
        id: commitatlas_compact
        uses: Chris0Jeky/CommitAtlas@68ac8985de842773768726c9c324cd7385065501
        with:
          config: .commitatlas.compact.json

      - name: Validate generated bundle
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const wideConfig = JSON.parse(fs.readFileSync('.commitatlas.json', 'utf8'));
          const compactConfig = JSON.parse(fs.readFileSync('.commitatlas.compact.json', 'utf8'));
          const { layout: _wideLayout, outputDir: _wideOutput, cards: _wideCards, ...wideShared } = wideConfig;
          const { layout: _compactLayout, outputDir: _compactOutput, cards: _compactCards, ...compactShared } = compactConfig;
          if (
            JSON.stringify(wideShared) !== JSON.stringify(compactShared) ||
            compactConfig.layout !== 'compact' ||
            compactConfig.outputDir !== 'assets/commitatlas-compact' ||
            JSON.stringify(compactConfig.cards) !== JSON.stringify(['atlas'])
          ) {
            throw new Error('Compact Atlas configuration drifted from the primary public snapshot');
          }
          const bundles = [
            {
              manifestPath: '${{ steps.commitatlas.outputs.manifest }}',
              outputDir: 'assets/commitatlas',
              expectedArtifacts: ['activity.svg', 'atlas.svg', 'languages.svg', 'profile.svg', 'projects.svg', 'streak.svg'],
            },
            {
              manifestPath: '${{ steps.commitatlas_compact.outputs.manifest }}',
              outputDir: 'assets/commitatlas-compact',
              expectedArtifacts: ['atlas.svg'],
            },
          ];
          for (const bundle of bundles) {
            const manifest = JSON.parse(fs.readFileSync(bundle.manifestPath, 'utf8'));
            const artifacts = manifest.artifacts.map((artifact) => artifact.path).sort();
            if (manifest.user !== 'Chris0Jeky' || JSON.stringify(artifacts) !== JSON.stringify(bundle.expectedArtifacts)) {
              throw new Error(`Unexpected CommitAtlas manifest for ${bundle.outputDir}`);
            }
            for (const artifact of manifest.artifacts) {
              const path = `${bundle.outputDir}/${artifact.path}`;
              const body = fs.readFileSync(path);
              const digest = crypto.createHash('sha256').update(body).digest('hex');
              if (body.length !== artifact.bytes || digest !== artifact.sha256) {
                throw new Error(`Manifest mismatch for ${path}`);
              }
            }
          }
          NODE

      - name: Commit refreshed public assets
        shell: bash
        run: |
          git add -- assets/commitatlas assets/commitatlas-compact
          if git diff --cached --quiet; then
            echo "CommitAtlas assets are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(profile): refresh CommitAtlas assets"
          git push origin HEAD:main
