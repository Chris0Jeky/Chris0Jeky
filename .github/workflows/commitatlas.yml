name: Refresh CommitAtlas profile

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: write

concurrency:
  group: commitatlas-profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'Chris0Jeky/Chris0Jeky'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Generate public CommitAtlas assets
        id: commitatlas
        uses: Chris0Jeky/CommitAtlas@f0fb0b66380bb626275073e076180fcba151cd4d
        with:
          config: .commitatlas.json

      - name: Validate generated bundle
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const manifest = JSON.parse(fs.readFileSync('${{ steps.commitatlas.outputs.manifest }}', 'utf8'));
          const expected = ['activity.svg', 'atlas-compact.svg', 'atlas.svg', 'breakdown.svg', 'cadence.svg', 'languages.svg', 'profile.svg', 'projects.json', 'projects.md', 'projects.svg', 'releases.svg', 'rhythm.svg', 'streak.svg'];
          const artifacts = manifest.artifacts.map((artifact) => artifact.path).sort();
          if (manifest.user !== 'Chris0Jeky' || JSON.stringify(artifacts) !== JSON.stringify(expected)) {
            throw new Error('Unexpected CommitAtlas responsive manifest');
          }
          if ('${{ steps.commitatlas.outputs.atlas-compact }}' !== 'assets/commitatlas/atlas-compact.svg') {
            throw new Error('Compact Atlas output is missing');
          }
          const expectedOutputs = {
            breakdown: 'assets/commitatlas/breakdown.svg',
            rhythm: 'assets/commitatlas/rhythm.svg',
            'projects-json': 'assets/commitatlas/projects.json',
            'projects-markdown': 'assets/commitatlas/projects.md',
          };
          if ('${{ steps.commitatlas.outputs.breakdown }}' !== expectedOutputs.breakdown) throw new Error('Breakdown output is missing');
          if ('${{ steps.commitatlas.outputs.rhythm }}' !== expectedOutputs.rhythm) throw new Error('Rhythm output is missing');
          if ('${{ steps.commitatlas.outputs['projects-json'] }}' !== expectedOutputs['projects-json']) throw new Error('Projects JSON output is missing');
          if ('${{ steps.commitatlas.outputs['projects-markdown'] }}' !== expectedOutputs['projects-markdown']) throw new Error('Projects Markdown output is missing');
          for (const artifact of manifest.artifacts) {
            const path = `assets/commitatlas/${artifact.path}`;
            const body = fs.readFileSync(path);
            const digest = crypto.createHash('sha256').update(body).digest('hex');
            if (body.length !== artifact.bytes || digest !== artifact.sha256) {
              throw new Error(`Manifest mismatch for ${path}`);
            }
          }
          NODE

      - name: Validate light bundle
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const primaryManifest = JSON.parse(fs.readFileSync('${{ steps.commitatlas.outputs.manifest }}', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('assets/commitatlas/light/manifest.json', 'utf8'));
          const expected = ['activity.svg', 'atlas-compact.svg', 'atlas.svg', 'breakdown.svg', 'cadence.svg', 'languages.svg', 'profile.svg', 'projects.json', 'projects.md', 'projects.svg', 'releases.svg', 'rhythm.svg', 'streak.svg'];
          const artifacts = manifest.artifacts.map((artifact) => artifact.path).sort();
          if (manifest.user !== 'Chris0Jeky' || JSON.stringify(artifacts) !== JSON.stringify(expected)) {
            throw new Error('Unexpected CommitAtlas light manifest');
          }
          if (manifest.generatedAt !== primaryManifest.generatedAt || JSON.stringify(manifest.window) !== JSON.stringify(primaryManifest.window)) {
            throw new Error('CommitAtlas theme manifests do not describe one atomic snapshot');
          }
          for (const artifact of manifest.artifacts) {
            const path = `assets/commitatlas/light/${artifact.path}`;
            const body = fs.readFileSync(path);
            const digest = crypto.createHash('sha256').update(body).digest('hex');
            if (body.length !== artifact.bytes || digest !== artifact.sha256) {
              throw new Error(`Manifest mismatch for ${path}`);
            }
          }
          NODE

      - name: Update generated selected work catalog
        shell: bash
        run: node scripts/update-project-catalog.mjs README.md assets/commitatlas/projects.json

      - name: Commit refreshed public assets
        shell: bash
        run: |
          git add -- README.md assets/commitatlas
          if git diff --cached --quiet; then
            echo "CommitAtlas assets are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(profile): refresh CommitAtlas assets"
          git push origin HEAD:main
