name: Tests

# Exercise the unattended profile consumers and prove that the committed snapshot reproduces
# its catalog and image versions before a pull request can replace the live README.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Run the profile consumer tests
        shell: bash
        run: |
          node --version
          node --test tests/*.test.mjs

      - name: Check the committed snapshot reproduces the README
        shell: bash
        run: |
          node scripts/update-project-catalog.mjs README.md assets/commitatlas/projects.json
          node scripts/update-commitatlas-image-versions.mjs
          git diff --exit-code -- README.md

