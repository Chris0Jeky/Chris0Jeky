<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Contribution breakdown" viewBox="0 0 720 220" width="720" height="220" fill="none"><title>Contribution breakdown</title><desc>GitHub public-profile activity percentages; not exact counts and not scoped to the requested contribution-calendar window. Basis: GitHub public-profile percentages from calendar-year profile views; these are not exact counts and are not scoped to the requested 365-day contribution-calendar window. Commits: 77.8%, Issues: 6.7%, Pull requests: 12.6%, Reviews: 2.9%.</desc><rect width="720" height="220" rx="18" fill="#0d1117"/><style>
