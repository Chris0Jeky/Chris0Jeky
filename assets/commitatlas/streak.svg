<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Contribution streak" viewBox="0 0 720 180" width="720" height="180" fill="none"><title>Contribution streak</title><desc>Current and longest GitHub contribution streaks in the returned window. Current streak: 30 days. Longest observed in the 365-day window: 53 days. History before this window is not observed. Last active 2026-08-20.</desc><rect width="720" height="180" rx="18" fill="#0d1117"/><style>
@keyframes card-enter{from{transform:translateY(4px)}to{transform:translateY(0)}}
.card-enter{transform-box:fill-box;transform-origin:center;animation:card-enter .38s ease-out both}
@media (prefers-reduced-motion:reduce){.card-enter{animation:none!important}}
